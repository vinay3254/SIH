apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: sih1745
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
      - name: ingestion
        image: sih1745/ingestion:latest
        ports:
        - containerPort: 5003
        envFrom:
        - configMapRef:
            name: sih1745-config
        - secretRef:
            name: sih1745-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5003
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5003
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: sih1745
spec:
  selector:
    app: ingestion
  ports:
    - protocol: TCP
      port: 5003
      targetPort: 5003
