apiVersion: apps/v1
kind: Deployment
metadata:
  name: case-mgmt
  namespace: sih1745
spec:
  replicas: 2
  selector:
    matchLabels:
      app: case-mgmt
  template:
    metadata:
      labels:
        app: case-mgmt
    spec:
      containers:
      - name: case-mgmt
        image: sih1745/case-mgmt:latest
        ports:
        - containerPort: 5002
        envFrom:
        - configMapRef:
            name: sih1745-config
        - secretRef:
            name: sih1745-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5002
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5002
---
apiVersion: v1
kind: Service
metadata:
  name: case-mgmt
  namespace: sih1745
spec:
  selector:
    app: case-mgmt
  ports:
    - protocol: TCP
      port: 5002
      targetPort: 5002
