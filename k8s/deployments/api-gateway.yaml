apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: sih1745
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: sih1745/api-gateway:latest
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: sih1745-config
        - secretRef:
            name: sih1745-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5000
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: sih1745
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
