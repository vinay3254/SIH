apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sih1745-ingress
  namespace: sih1745
spec:
  ingressClassName: nginx
  rules:
  - host: sih1745.lea.local
    http:
      paths:
      - path: /api/v1/auth
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 5000
      - path: /api/v1/cases
        pathType: Prefix
        backend:
          service:
            name: case-mgmt
            port:
              number: 5002
      - path: /api/v1/ingest
        pathType: Prefix
        backend:
          service:
            name: ingestion
            port:
              number: 5003
      - path: /api/v1/analysis
        pathType: Prefix
        backend:
          service:
            name: analysis-engine
            port:
              number: 5004
      - path: /api/v1/graph
        pathType: Prefix
        backend:
          service:
            name: graph-service
            port:
              number: 5005
      - path: /api/v1/audit
        pathType: Prefix
        backend:
          service:
            name: audit-service
            port:
              number: 5001
